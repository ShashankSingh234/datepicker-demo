<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Date Picker Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    h1 { font-size: 1.25rem; font-weight: 600; color: #111; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.875rem; color: #666; margin-bottom: 1.75rem; }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 0.375rem;
    }

    /* ── Native date input (Desktop) ── */
    input[type="date"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      color: #111;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="date"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    input[type="date"]:disabled {
      background: #f9fafb;
      color: #aaa;
      cursor: not-allowed;
    }

    /* ── Fake input shown on mobile (iOS + Android) ── */
    .mobile-date-display {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      color: #111;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-date-display.disabled {
      background: #f9fafb;
      color: #aaa;
      cursor: not-allowed;
      pointer-events: none;
    }

    .mobile-date-display:active { border-color: #6366f1; }
    .mobile-date-display .placeholder { color: #9ca3af; }
    .mobile-date-display .arrow { color: #9ca3af; font-size: 0.75rem; }

    .hint { font-size: 0.75rem; color: #888; margin-top: 0.3rem; }
    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.5rem 0; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 6px;
      font-weight: 500;
    }

    .range-row { display: flex; gap: 0.75rem; }
    .range-row .field { flex: 1; }

    #result-panel {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: #f9fafb;
      border-radius: 8px;
      font-size: 0.8125rem;
      color: #555;
      display: none;
    }
    #result-panel.visible { display: block; }
    #result-panel .row { display: flex; justify-content: space-between; padding: 3px 0; }
    #result-panel .row span:last-child { font-weight: 500; color: #111; }

    .device-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #d1fae5;
      color: #065f46;
      border-radius: 999px;
      padding: 2px 10px;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    /* ── Wheel Picker Overlay (slides up from bottom like keyboard) ── */
    .picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1000;
      align-items: flex-end;
    }
    .picker-overlay.open { display: flex; }

    .picker-sheet {
      width: 100%;
      background: #f2f2f7;
      border-radius: 16px 16px 0 0;
      overflow: hidden;
      animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* ── Toolbar with Cancel / Title / Done ── */
    .picker-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: #f2f2f7;
      border-bottom: 1px solid #c8c8cc;
    }

    .picker-toolbar button {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
    }

    .btn-cancel { color: #888; }
    .btn-done   { color: #007aff; font-weight: 600; }
    .picker-toolbar-title { font-size: 0.9375rem; font-weight: 600; color: #111; }

    /* ── Three scroll wheels (Day / Month / Year) ── */
    .picker-wheels {
      display: flex;
      height: 216px;
      overflow: hidden;
      background: #f2f2f7;
      position: relative;
    }

    /* Horizontal lines above and below the selected item */
    .picker-wheels::before,
    .picker-wheels::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: #c8c8cc;
      z-index: 2;
      pointer-events: none;
    }
    .picker-wheels::before { top: calc(50% - 18px); }
    .picker-wheels::after  { top: calc(50% + 18px); }

    /* Fade gradient so items appear to fade into the background */
    .picker-wheels .fade-top,
    .picker-wheels .fade-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 80px;
      z-index: 1;
      pointer-events: none;
    }
    .picker-wheels .fade-top {
      top: 0;
      background: linear-gradient(to bottom, #f2f2f7 0%, transparent 100%);
    }
    .picker-wheels .fade-bottom {
      bottom: 0;
      background: linear-gradient(to top, #f2f2f7 0%, transparent 100%);
    }

    /* Each individual scroll column */
    .picker-wheel {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;   /* snaps to each item */
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .picker-wheel::-webkit-scrollbar { display: none; }

    /* Top & bottom padding makes first/last items centerable */
    .picker-wheel-inner { padding: 90px 0; }

    .picker-wheel-item {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      font-size: 1.125rem;
      color: #111;
    }

    /* Column header labels below the wheels */
    .picker-labels {
      display: flex;
      padding: 0 0.5rem 0.5rem;
      background: #f2f2f7;
    }
    .picker-labels span {
      flex: 1;
      text-align: center;
      font-size: 0.7rem;
      color: #888;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Date Picker Demo</h1>
  <p class="subtitle">Adapts to your device automatically.</p>
  <div class="device-badge" id="deviceBadge">Detecting device...</div>

  <!-- ── Single date picker ── -->
  <div class="field">
    <label>Pick a date <span class="badge">dynamic range</span></label>

    <!-- Shown on Desktop: native browser date input -->
    <input type="date" id="singleDate" style="display:none" />

    <!-- Shown on iOS + Android: tappable div that opens wheel picker -->
    <div class="mobile-date-display" id="singleDisplay" style="display:none"
         onclick="openPicker('single')">
      <span id="singleDisplayText" class="placeholder">Select date</span>
      <span class="arrow">▼</span>
    </div>

    <p class="hint">Allowed: last 30 days → 1 year from today</p>
  </div>

  <hr class="divider" />

  <!-- ── Linked start / end range ── -->
  <p style="font-size:0.8125rem;font-weight:500;color:#444;margin-bottom:0.75rem;">
    Start &amp; End range <span class="badge">linked</span>
  </p>

  <div class="range-row">
    <div class="field">
      <label>Start date</label>
      <input type="date" id="startDate" style="display:none" />
      <div class="mobile-date-display" id="startDisplay" style="display:none"
           onclick="openPicker('start')">
        <span id="startDisplayText" class="placeholder">Select</span>
        <span class="arrow">▼</span>
      </div>
      <p class="hint">Today → 1 year ahead</p>
    </div>
    <div class="field">
      <label>End date</label>
      <!-- End date starts disabled; unlocks after start is chosen -->
      <input type="date" id="endDate" disabled style="display:none" />
      <div class="mobile-date-display disabled" id="endDisplay" style="display:none"
           onclick="openPicker('end')">
        <span id="endDisplayText" class="placeholder">Select</span>
        <span class="arrow">▼</span>
      </div>
      <p class="hint">1–90 days after start</p>
    </div>
  </div>

  <!-- Result summary shown after both start and end are picked -->
  <div id="result-panel">
    <div class="row"><span>Start</span><span id="r-start">—</span></div>
    <div class="row"><span>End</span><span id="r-end">—</span></div>
    <div class="row"><span>Duration</span><span id="r-days">—</span></div>
  </div>
</div>

<!-- ── Wheel Picker Bottom Sheet (iOS + Android only) ── -->
<div class="picker-overlay" id="pickerOverlay" onclick="handleOverlayClick(event)">
  <div class="picker-sheet">
    <div class="picker-toolbar">
      <button class="btn-cancel" onclick="closePicker(false)">Cancel</button>
      <span class="picker-toolbar-title" id="pickerTitle">Select Date</span>
      <button class="btn-done" onclick="closePicker(true)">Done</button>
    </div>
    <div class="picker-wheels">
      <div class="fade-top"></div>
      <div class="fade-bottom"></div>
      <!-- Day column -->
      <div class="picker-wheel" id="wheelDay">
        <div class="picker-wheel-inner" id="wheelDayInner"></div>
      </div>
      <!-- Month column -->
      <div class="picker-wheel" id="wheelMonth">
        <div class="picker-wheel-inner" id="wheelMonthInner"></div>
      </div>
      <!-- Year column -->
      <div class="picker-wheel" id="wheelYear">
        <div class="picker-wheel-inner" id="wheelYearInner"></div>
      </div>
    </div>
    <div class="picker-labels">
      <span>Day</span><span>Month</span><span>Year</span>
    </div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────
  // UTILITY FUNCTIONS
  // ─────────────────────────────────────────────────────────────

  /**
   * Format a Date object as "YYYY-MM-DD" using LOCAL date parts.
   * IMPORTANT: Do NOT use toISOString() here — it converts to UTC
   * which shifts the date back by 1 day for timezones ahead of UTC
   * (e.g. India is UTC+5:30, so midnight local = previous day in UTC).
   */
  function fmt(d) {
    const y   = d.getFullYear();
    const m   = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  /** Add n days to a date (returns new Date, does not mutate) */
  function addDays(d, n) {
    const r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }

  /** Add n years to a date (returns new Date, does not mutate) */
  function addYears(d, n) {
    const r = new Date(d);
    r.setFullYear(r.getFullYear() + n);
    return r;
  }

  /**
   * Convert "YYYY-MM-DD" string to a human-readable label like "16 Jun 2026".
   * Parse with new Date(y, m-1, d) — NOT new Date(str) — to avoid UTC shift.
   */
  function friendly(str) {
    if (!str) return null;
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, {
      day: "numeric", month: "short", year: "numeric"
    });
  }

  /**
   * Debounce: delays fn execution until delay ms after last call.
   * Used so the day wheel only rebuilds after the user stops scrolling
   * month/year (not on every pixel of scroll).
   */
  function debounce(fn, delay) {
    let t;
    return function () { clearTimeout(t); t = setTimeout(fn, delay); };
  }

  const MONTHS = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  // ─────────────────────────────────────────────────────────────
  // DEVICE DETECTION
  // ─────────────────────────────────────────────────────────────

  /**
   * ==============================================================
   * CHANGE THIS LINE to control which devices use the wheel picker.
   *
   * Current: iOS + Android both get wheel picker
   *   const isMobile = /iPad|iPhone|iPod|Android/i.test(navigator.userAgent) && !window.MSStream;
   *
   * For iOS wheel only + Android default:
   *   const isMobile = /iPad|iPhone|iPod/i.test(navigator.userAgent) && !window.MSStream;
   *   (Remove "Android" from the regex — see notes at bottom of file)
   * ==============================================================
   */
  const isMobile = /iPad|iPhone|iPod|Android/i.test(navigator.userAgent) && !window.MSStream;

  // Show a label in the UI so you can verify detection while testing
  const ua = navigator.userAgent;
  document.getElementById("deviceBadge").textContent =
    /iPad|iPhone|iPod/i.test(ua) ? "iOS — Wheel picker"     :
    /Android/i.test(ua)          ? "Android — Wheel picker" :
                                   "Desktop — Browser picker";

  // ─────────────────────────────────────────────────────────────
  // DATE RANGES (calculated from today)
  // ─────────────────────────────────────────────────────────────

  const today = new Date();
  today.setHours(0, 0, 0, 0); // normalize to midnight so comparisons are date-only

  const ranges = {
    single: { min: addDays(today, -30),  max: addYears(today, 1) }, // last 30 days → +1 year
    start:  { min: today,                max: addYears(today, 1) }, // today → +1 year
    end:    { min: null, max: null }  // set dynamically when start is chosen
  };

  // ─────────────────────────────────────────────────────────────
  // SELECTED VALUES STATE
  // ─────────────────────────────────────────────────────────────

  // Holds the currently selected "YYYY-MM-DD" string for each picker.
  // Pre-filled with today so pickers open on today by default.
  const values = { single: fmt(today), start: fmt(today), end: "" };

  // ─────────────────────────────────────────────────────────────
  // SHOW CORRECT INPUT PER DEVICE
  // ─────────────────────────────────────────────────────────────

  // Each field has two elements in the HTML:
  //   - <input type="date">      → shown on Desktop
  //   - <div .mobile-date-display> → shown on iOS + Android
  // Only one is visible at a time based on isMobile.
  ["single", "start", "end"].forEach(key => {
    const nativeId  = key === "single" ? "singleDate"    : key + "Date";
    const displayId = key === "single" ? "singleDisplay" : key + "Display";
    document.getElementById(displayId).style.display = isMobile ? "flex"  : "none";
    document.getElementById(nativeId).style.display  = isMobile ? "none"  : "block";
  });

  // ─────────────────────────────────────────────────────────────
  // NATIVE INPUT SETUP — Desktop only
  // ─────────────────────────────────────────────────────────────

  if (!isMobile) {
    // Single date picker
    const singleDate = document.getElementById("singleDate");
    singleDate.min   = fmt(ranges.single.min);
    singleDate.max   = fmt(ranges.single.max);
    singleDate.value = values.single;
    singleDate.addEventListener("change", () => { values.single = singleDate.value; });

    // Linked start / end
    const startDate = document.getElementById("startDate");
    const endDate   = document.getElementById("endDate");
    startDate.min   = fmt(ranges.start.min);
    startDate.max   = fmt(ranges.start.max);
    startDate.value = values.start;

    /** Recalculate end date min/max whenever start changes */
    function updateEndNative() {
      const s = startDate.value;
      if (!s) { endDate.disabled = true; return; }
      const sel = new Date(s + "T00:00:00");
      endDate.disabled = false;
      endDate.min = fmt(addDays(sel, 1));   // end must be at least 1 day after start
      endDate.max = fmt(addDays(sel, 90));  // end can be at most 90 days after start
      // Clear end if it falls outside the new range
      if (endDate.value && (endDate.value < endDate.min || endDate.value > endDate.max))
        endDate.value = "";
      updateResult();
    }

    startDate.addEventListener("change", updateEndNative);
    endDate.addEventListener("change", updateResult);
    updateEndNative(); // run once on load to set initial end range
  }

  // ─────────────────────────────────────────────────────────────
  // RESULT PANEL — updates after both start and end are selected
  // ─────────────────────────────────────────────────────────────

  function updateResult() {
    const s = values.start, e = values.end;
    const panel = document.getElementById("result-panel");
    document.getElementById("r-start").textContent = friendly(s) || "—";
    document.getElementById("r-end").textContent   = friendly(e) || "—";

    if (s && e) {
      // Parse date strings as local dates (not UTC) to get correct diff
      const [sy, sm, sd] = s.split("-").map(Number);
      const [ey, em, ed] = e.split("-").map(Number);
      const diff = Math.round(
        (new Date(ey, em - 1, ed) - new Date(sy, sm - 1, sd)) / 86400000
      );
      document.getElementById("r-days").textContent = diff + " day" + (diff !== 1 ? "s" : "");
      panel.classList.add("visible");
    } else {
      document.getElementById("r-days").textContent = "—";
      panel.classList.toggle("visible", !!s);
    }
  }

  // ─────────────────────────────────────────────────────────────
  // WHEEL PICKER — iOS + Android
  // ─────────────────────────────────────────────────────────────

  let activePicker = null; // which field is currently open: 'single' | 'start' | 'end'
  let pickerMin, pickerMax; // date range for the currently open picker

  /** Populate a wheel column with an array of string items */
  function buildWheel(innerId, items) {
    const inner = document.getElementById(innerId);
    inner.innerHTML = "";
    items.forEach(text => {
      const div = document.createElement("div");
      div.className = "picker-wheel-item";
      div.textContent = text;
      inner.appendChild(div);
    });
  }

  /** Scroll a wheel to a specific item index (each item is 36px tall) */
  function scrollTo(wheelId, index) {
    document.getElementById(wheelId).scrollTop = index * 36;
  }

  /** Get the currently centred item index from scroll position */
  function getIndex(wheelId) {
    return Math.floor((document.getElementById(wheelId).scrollTop + 18) / 36);
  }

  /**
   * Rebuild the day wheel based on the currently selected month and year.
   * This fixes the bug where months with <31 days (e.g. April, February)
   * would still show 31 days. Called whenever month or year wheel is scrolled.
   */
  function rebuildDayWheel() {
    const y1          = pickerMin.getFullYear();
    const year        = y1 + getIndex("wheelYear");
    const month       = getIndex("wheelMonth"); // 0-based
    const daysInMonth = new Date(year, month + 1, 0).getDate(); // last day of month
    const currentDay  = getIndex("wheelDay") + 1;

    buildWheel("wheelDayInner",
      Array.from({length: daysInMonth}, (_, i) => String(i + 1).padStart(2, "0"))
    );

    // Clamp selected day if it exceeds new month's max (e.g. was 31st, now April → 30th)
    const clampedDay = Math.min(currentDay, daysInMonth);
    scrollTo("wheelDay", clampedDay - 1);
  }

  // Debounced version — only fires 120ms after scrolling stops
  const debouncedRebuild = debounce(rebuildDayWheel, 120);

  /** Open the wheel picker for a given field key */
  function openPicker(key) {
    // Don't open end picker if start hasn't been chosen yet
    if (key === "end" && !values.start) return;

    activePicker = key;

    // Set min/max for this picker
    pickerMin = new Date(ranges[key] && ranges[key].min ? ranges[key].min : today);
    pickerMax = new Date(ranges[key] && ranges[key].max ? ranges[key].max : addYears(today, 1));

    // For end date, compute min/max dynamically from the chosen start date
    if (key === "end" && values.start) {
      const [sy, sm, sd] = values.start.split("-").map(Number);
      const s = new Date(sy, sm - 1, sd);
      pickerMin = addDays(s, 1);   // at least 1 day after start
      pickerMax = addDays(s, 90);  // at most 90 days after start
    }

    // Set the sheet title
    const titles = { single: "Select Date", start: "Start Date", end: "End Date" };
    document.getElementById("pickerTitle").textContent = titles[key];

    // Build month and year wheels
    buildWheel("wheelMonthInner", MONTHS);
    const y1 = pickerMin.getFullYear(), y2 = pickerMax.getFullYear();
    buildWheel("wheelYearInner",
      Array.from({length: y2 - y1 + 1}, (_, i) => String(y1 + i))
    );

    // Determine initial date to scroll to (current value or pickerMin)
    const cur = values[key]
      ? (() => { const [y, m, d] = values[key].split("-").map(Number); return new Date(y, m - 1, d); })()
      : new Date(pickerMin);

    setTimeout(() => {
      // Scroll month and year first, THEN build the day wheel for that month/year.
      // Order matters: day wheel must know the correct month before building.
      scrollTo("wheelMonth", cur.getMonth());
      scrollTo("wheelYear",  cur.getFullYear() - y1);

      // Build day wheel with correct number of days for this month/year
      const daysInMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
      buildWheel("wheelDayInner",
        Array.from({length: daysInMonth}, (_, i) => String(i + 1).padStart(2, "0"))
      );
      scrollTo("wheelDay", cur.getDate() - 1);

      // Attach scroll listeners so day wheel updates when month/year changes
      document.getElementById("wheelMonth").onscroll = debouncedRebuild;
      document.getElementById("wheelYear").onscroll  = debouncedRebuild;
    }, 20);

    document.getElementById("pickerOverlay").classList.add("open");
    document.body.style.overflow = "hidden"; // prevent background scroll while picker is open
  }

  /** Read the currently centred items across all three wheels and return a Date */
  function getPickedDate() {
    const y1          = pickerMin.getFullYear();
    const year        = y1 + getIndex("wheelYear");
    const month       = getIndex("wheelMonth"); // 0-based
    const day         = getIndex("wheelDay") + 1;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    // Clamp day in case month was changed after day was set
    return new Date(year, month, Math.min(day, daysInMonth));
  }

  /** Close the picker. If confirm=true, save the picked date. */
  function closePicker(confirm) {
    if (confirm) {
      let picked = getPickedDate();

      // Clamp to allowed min/max range
      if (picked < pickerMin) picked = new Date(pickerMin);
      if (picked > pickerMax) picked = new Date(pickerMax);

      const pickedStr = fmt(picked);
      values[activePicker] = pickedStr;

      // Update the display div text
      const textIds = {
        single: "singleDisplayText",
        start:  "startDisplayText",
        end:    "endDisplayText"
      };
      const el = document.getElementById(textIds[activePicker]);
      el.textContent = friendly(pickedStr);
      el.classList.remove("placeholder");

      // If start date changed: reset end date and re-enable end picker
      if (activePicker === "start") {
        values.end = "";
        const endText = document.getElementById("endDisplayText");
        endText.textContent = "Select";
        endText.classList.add("placeholder");
        document.getElementById("endDisplay").classList.remove("disabled");
      }

      updateResult();
    }

    // Remove scroll listeners to avoid stale callbacks on next open
    document.getElementById("wheelMonth").onscroll = null;
    document.getElementById("wheelYear").onscroll  = null;

    document.getElementById("pickerOverlay").classList.remove("open");
    document.body.style.overflow = ""; // restore background scroll
    activePicker = null;
  }

  /** Close picker without saving if user taps the dark overlay behind the sheet */
  function handleOverlayClick(e) {
    if (e.target === document.getElementById("pickerOverlay")) closePicker(false);
  }

  // ─────────────────────────────────────────────────────────────
  // INIT — pre-fill mobile display labels with today's date
  // ─────────────────────────────────────────────────────────────

  if (isMobile) {
    document.getElementById("singleDisplayText").textContent = friendly(values.single);
    document.getElementById("singleDisplayText").classList.remove("placeholder");
    document.getElementById("startDisplayText").textContent  = friendly(values.start);
    document.getElementById("startDisplayText").classList.remove("placeholder");
  }
</script>
</body>
</html>
